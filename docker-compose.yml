name: dsl-log-viewer

services:
  dsl-log-viewer:
    container_name: dsl-log-viewer
    build:
      context: .
      dockerfile: Dockerfile
      pull: true
    ports:
      - "5900:5900"
    expose:
      - "5900"
    restart: unless-stopped


# copy docker-compose.yml and Dockerfile and nginx.conf to server
# --
# on server,
# docker compose up --build
# d (to detach)
# --
# Check logs
# docker logs -f --tail 200 dsl-log-viewer
